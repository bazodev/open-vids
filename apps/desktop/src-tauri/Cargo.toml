[package]
name = "openvids-desktop"
version = "0.5.4"
description = "OpenVids — agent-native desktop video editor"
homepage = "https://openvids.ai"
authors = ["OpenVids"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "openvids_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json = "1"

[dependencies]
# `unstable`: child webviews in one window (`Window::add_child`) for project tabs, see `tab_webviews.rs`.
tauri = { version = "2", features = ["unstable"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The fork job's slot (home_fork.rs): a lock without a poisoning path to unwrap.
parking_lot = "0.12"
rfd = "0.15"
getrandom = "0.3"
sys-locale = "0.3"
trash = "5"
# WHATWG URL parsing for the Asset Search policy (research_policy.rs): the same
# host normalization as `new URL` in the Studio server. Already in the tree via tauri.
url = "2"
tauri-plugin-updater = "2"
semver = "1"
# The usage statistics POST (telemetry.rs) and the bug-report upload
# (report.rs): a small blocking client on its own thread, rustls with ring
# (already in the tree via the updater) and Mozilla's roots.
ureq = { version = "3", default-features = false, features = ["rustls"] }
# Bug reports: the challenge hash (report.rs) and the gzipped log part.
# flate2's pure-Rust backend keeps the build free of a C zlib dependency.
sha2 = "0.10"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
# Client-side log redaction (report.rs): a dozen patterns for keys, tokens,
# JWTs and emails. Already in the tree via Tauri.
regex = "1"
# The FFmpeg download on Windows (ffmpeg_install.rs): zip extraction of the pinned
# official build. `zip` reads only local data (no network features); `sha2`
# above verifies the archive against the digest pinned in the binary.
zip = { version = "4", default-features = false, features = ["deflate"] }

[target.'cfg(unix)'.dependencies]
# killpg, for reaping the sidecar's whole process group. See sidecar::terminate.
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# Job Objects + CREATE_NO_WINDOW for the whole-tree child supervision in
# proc.rs, and the reparse-point attribute the directory copies skip. Same
# 0.61 line the tree already links, so nothing new is vendored.
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
] }

[target.'cfg(target_os = "macos")'.dependencies]
# Reading the drag pasteboard for real file paths of a drop on the Projects
# page (drop_paths.rs). Same versions wry already links.
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSPasteboard"] }
objc2-foundation = { version = "0.3", default-features = false, features = [
  "std",
  "NSArray",
  "NSString",
] }

[dev-dependencies]
# The updater's channel selection runs against a mock app (updater.rs tests).
tauri = { version = "2", features = ["test"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
