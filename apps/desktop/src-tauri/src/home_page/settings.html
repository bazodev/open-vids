<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title data-i18n="settings.window.documentTitle">Settings — OpenVids</title>
    <link rel="stylesheet" href="/assets/ov.css" />
    <link rel="stylesheet" href="/assets/composer.css" />
    <link rel="stylesheet" href="/assets/settings.css" />
    <script>
      window.OV_TOKEN = "__OPENVids_TOKEN__";
      window.OV_LOCALES = "__OV_LOCALES__";
    </script>
    <script src="/assets/shared.js"></script>
    <script src="/assets/i18n.js"></script>
    <script>
      /* The theme and density the page underneath shows (?theme=, ?density=), before first paint. */
      OV.applyTheme(new URLSearchParams(location.search).get("theme") || "system");
      /* The page and its Settings iframe share the boot frame; set the frame class before paint. */
      if (OV.isCustomFrame()) document.documentElement.classList.add("custom-frame");
      document.documentElement.classList.add("st-embed");
      OV.applyDensity(new URLSearchParams(location.search).get("density") || "default");
      /* The language the page underneath shows (?language=: the raw preference); the server injects the catalog. */
      OVI18N.init(
        new URLSearchParams(location.search).get("language") || "system",
        window.OV_LOCALES && typeof window.OV_LOCALES === "object" ? window.OV_LOCALES : undefined,
      );
    </script>
  </head>
  <body class="st-body">
    <div
      class="window st-win"
      id="win"
      role="dialog"
      aria-labelledby="stTitle"
      data-density="default"
    >
      <header class="titlebar st-titlebar">
        <div class="tl-group">
          <button
            type="button"
            class="tl close"
            aria-label="Close Settings"
            data-i18n-aria-label="settings.window.close"
          ></button
          ><span class="tl min" aria-hidden="true"></span
          ><span class="tl max" aria-hidden="true"></span>
        </div>
        <span class="st-title" id="stTitle" data-i18n="settings.window.heading">Settings</span>
      </header>
      <div class="st-layout">
        <nav
          class="st-nav"
          id="stNav"
          aria-label="Settings sections"
          data-i18n-aria-label="settings.nav.label"
        ></nav>
        <main class="st-main" id="stMain" tabindex="-1"></main>
      </div>
    </div>
    <script>
      OV.mountSprite();
    </script>
    <script src="/assets/settings-core.js"></script>
    <script src="/assets/settings-general.js"></script>
    <script src="/assets/settings-agents.js"></script>
    <script src="/assets/settings-providers.js"></script>
    <script src="/assets/settings-signin.js"></script>
    <script src="/assets/settings-jev.js"></script>
    <script src="/assets/settings-assets.js"></script>
    <script src="/assets/settings-execution.js"></script>
    <script src="/assets/settings.js"></script>
  </body>
</html>
