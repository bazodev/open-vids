<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title data-i18n="home.page.title">Projects — OpenVids</title>
    <link rel="stylesheet" href="/assets/ov.css" />
    <link rel="stylesheet" href="/assets/composer.css" />
    <link rel="stylesheet" href="/assets/home.css" />
    <link rel="stylesheet" href="/assets/settings.css" />
    <link rel="stylesheet" href="/assets/onboarding.css" />
    <script>
      /* Per-launch token (every /api call) and the boot state Rust injects: intro flag + preferences. */
      window.OV_TOKEN = "__OPENVids_TOKEN__";
      window.OV_BOOT = "__OV_BOOT__";
    </script>
    <script src="/assets/shared.js"></script>
    <script src="/assets/i18n.js"></script>
    <script>
      /* Theme and density before first paint (Settings → Appearance), then the launch intro gate: it plays on a cold start
   and on reload; Rust skips it when the window comes back from a project or opens one at launch, and it
   never plays under reduced motion. ?intro=1 forces it (review). */
      (function () {
        var boot = window.OV_BOOT || {};
        OV.applyTheme(boot.prefs && boot.prefs.theme);
        OV.applyDensity(boot.prefs && boot.prefs.density);
        /* Language: the server injects the catalog (OV_BOOT.locales), so the first paint is already translated. */
        OVI18N.init(boot.prefs && boot.prefs.language, boot.locales);
        /* First-run onboarding: decided here, before first paint, so Projects never flashes first. It shows until
   setup is finished (or skipped), and when Help › Welcome asked for it. ?onboarding=1|0 forces it (review). */
        var ob = new URLSearchParams(location.search).get("onboarding");
        var done = !!(boot.prefs && boot.prefs.onboarding && boot.prefs.onboarding.completedAt);
        if (ob === "1" || (ob !== "0" && (boot.openOnboarding || !done)))
          document.documentElement.classList.add("is-onboarding");
        var force = new URLSearchParams(location.search).get("intro") === "1";
        if (
          !force &&
          (!boot.intro ||
            navigator.webdriver ||
            matchMedia("(prefers-reduced-motion: reduce)").matches)
        )
          return;
        document.documentElement.classList.add("is-launching");
      })();
    </script>
  </head>
  <body>
    <div class="window" id="win">
      <div class="launch" id="launch">
        <div class="launch-half top" aria-hidden="true"></div>
        <div class="launch-half bot" aria-hidden="true"></div>
        <div class="launch-seam" aria-hidden="true"></div>
        <div class="launch-core" aria-hidden="true">
          <img width="272" height="77" alt="" />
          <div class="launch-meta">
            <span class="launch-rec"></span><span>REC</span
            ><span class="launch-tc" data-launch-tc>00:00:00:00</span>
          </div>
        </div>
        <button class="btn btn-ghost btn-sm launch-skip" type="button">
          <span data-i18n="home.launch.skip">Skip</span> <span class="kbd">esc</span>
        </button>
      </div>
      <script>
        /* The prototype's launch splash: the logo records itself (3.0 s), a seam draws, the window splits open.
     Runs right after the splash markup so the logo starts loading before the rest of the window parses. */
        (function () {
          const launch = document.getElementById("launch"),
            root = document.documentElement;
          if (!root.classList.contains("is-launching")) {
            launch.remove();
            return;
          }
          const win = document.getElementById("win"),
            img = launch.querySelector("img"),
            tcEl = launch.querySelector("[data-launch-tc]");
          const T = 3000,
            FPS = 24,
            pad = (n) => String(n).padStart(2, "0");
          const tc = (ms) => {
            const f = Math.floor((ms / 1000) * FPS),
              s = Math.floor(f / FPS);
            return (
              pad(Math.floor(s / 3600)) +
              ":" +
              pad(Math.floor(s / 60) % 60) +
              ":" +
              pad(s % 60) +
              ":" +
              pad(f % FPS)
            );
          };
          let t0 = 0,
            done = false,
            open = false;
          /* The window underneath stays unreachable until the split: no Tab stops, no ⌘N / ⌘O behind the splash. */
          const lock = (on) => {
            const hold = on || root.classList.contains("is-onboarding");
            for (const el of win.children) {
              if (el === launch || el.id === "ob" || el.tagName === "SCRIPT") continue;
              /* The custom frame's window buttons stay usable under the lock. */
              if (el.classList.contains("titlebar")) {
                for (const part of el.children)
                  if (
                    part.id !== "winControls" &&
                    part.id !== "appMenuBtn" &&
                    part.id !== "menuBar"
                  )
                    part.inert = hold;
                const mid = el.querySelector("#tb-mid");
                if (mid) mid.inert = hold;
                continue;
              }
              el.inert = hold;
            }
          };
          document.addEventListener("DOMContentLoaded", () => {
            if (!open) lock(true);
          });
          function onKey(e) {
            e.stopPropagation();
            if (e.metaKey || e.ctrlKey) e.preventDefault();
            if (e.key === "Escape") close();
          }
          function step(now) {
            if (done) return;
            const t = Math.min(T, now - t0);
            tcEl.textContent = tc(t);
            if (t < T) requestAnimationFrame(step);
            else close();
          }
          function start() {
            if (t0) return;
            t0 = performance.now();
            requestAnimationFrame(step);
          }
          function close() {
            if (done) return;
            done = true;
            launch.classList.add("cut");
            setTimeout(() => {
              open = true;
              launch.classList.add("out");
              lock(false);
              removeEventListener("keydown", onKey, true);
              setTimeout(() => {
                launch.remove();
                root.classList.remove("is-launching");
                document.dispatchEvent(new Event("ov-launch-done"));
              }, 1300);
            }, 400);
          }
          img.addEventListener("load", start);
          img.addEventListener("error", start);
          setTimeout(start, 900);
          img.src =
            root.dataset.theme === "light"
              ? "/assets/logo-intro-light.svg"
              : "/assets/logo-intro.svg";
          launch.querySelector(".launch-skip").addEventListener("click", close);
          addEventListener("keydown", onKey, true);
        })();
      </script>

          id="appMenuBtn"

          aria-label="Application menu"
          data-i18n-aria-label="menu.app.menu"
          aria-haspopup="menu"
          aria-expanded="false"

              cx="22.36"
              cy="-21.09"
              r="19.26"
              fill="none"
              stroke="currentColor"
              stroke-width="6.2"
            />

              x="0"
              y="19.2"
              width="68.32"

              fill="var(--accent)"

              stroke-width="4.2"
              stroke-linejoin="round"
            />
          </svg>
        </button>
        <!-- Windows custom frame only (shown by home.js when OV.isCustomFrame()): the plain-text menu bar
          (File Edit View Window Help) wearing the toolbar's own button shape. Replaces the single
          dropdown with a real menu bar; once a menu is open, hovering another label switches to it,
          and Left/Right move between labels. macOS keeps its native bar and never draws this. -->
        <nav class="menubar" id="menuBar" aria-label="Application menus" hidden>
          <button
            class="menubar-item"
            type="button"
            data-menu="file"
            aria-haspopup="menu"
            aria-expanded="false"
          >
            <span data-i18n="menu.file.title">File</span>
          </button>
          <button
            class="menubar-item"
            type="button"
            data-menu="edit"
            aria-haspopup="menu"
            aria-expanded="false"
          >
            <span data-i18n="menu.edit.title">Edit</span>
          </button>
          <button
            class="menubar-item"
            type="button"
            data-menu="view"
            aria-haspopup="menu"
            aria-expanded="false"
          >
            <span data-i18n="menu.view.title">View</span>
          </button>
          <button
            class="menubar-item"
            type="button"
            data-menu="window"
            aria-haspopup="menu"
            aria-expanded="false"
          >
            <span data-i18n="menu.window.title">Window</span>
          </button>
          <button
            class="menubar-item"
            type="button"
            data-menu="help"
            aria-haspopup="menu"
            aria-expanded="false"
          >
            <span data-i18n="menu.help.title">Help</span>
          </button>
        </nav>

        </div>
        <div class="tb-mid" id="tb-mid">
          <div
            class="tb-side tb-new"
            id="tb-new"
            role="toolbar"
            aria-label="Projects toolbar"
            data-i18n-aria-label="home.toolbar.label"
          >
            <button
              class="btn"
              id="openBtn"
              type="button"
              data-tip="Open an existing project from disk"
              data-tip-i18n="home.toolbar.openTip"
              data-kbd="⌘O"
              data-tip-align="end"
            ></button>
            <button
              class="btn"
              id="newBtn"
              type="button"
              data-tip="Create a new project"
              data-tip-i18n="home.toolbar.newTip"
              data-kbd="⌘N"
              data-tip-align="end"
            ></button>
          </div>
          <div class="tb-search-center">
            <div class="field" id="field">
              <span id="fieldIcon"></span>
              <input
                id="search"
                type="text"
                placeholder="Search projects"
                data-i18n-placeholder="home.search.placeholder"
                aria-label="Search projects"
                data-i18n-aria-label="home.search.label"
                autocomplete="off"
                spellcheck="false"
              />
              <span class="kbd">⌘F</span>
              <button
                class="clear"
                id="clearSearch"
                type="button"
                aria-label="Clear search"
                data-i18n-aria-label="home.search.clear"
              ></button>
            </div>
          </div>
          <div
            class="tb-side tb-view"
            id="tb-tools"
            role="toolbar"
            aria-label="Projects toolbar"
            data-i18n-aria-label="home.toolbar.label"
          >
            <div
              class="seg"
              role="group"
              aria-label="View mode"
              data-i18n-aria-label="home.view.label"
            >
              <button
                id="viewGrid"
                type="button"
                aria-pressed="true"
                aria-label="Grid view"
                data-i18n-aria-label="home.view.grid"
                data-tip="Grid view"
                data-tip-i18n="home.view.grid"
                data-kbd="⌘1"
              ></button>
              <button
                id="viewList"
                type="button"
                aria-pressed="false"
                aria-label="List view"
                data-i18n-aria-label="home.view.list"
                data-tip="List view"
                data-tip-i18n="home.view.list"
                data-kbd="⌘2"
              ></button>
            </div>
            <button
              class="icon-btn"
              id="settingsBtn"
              type="button"
              aria-label="Settings"
              data-i18n-aria-label="home.toolbar.settings"
              data-tip="Settings"
              data-tip-i18n="home.toolbar.settings"
              data-kbd="⌘,"
            ></button>
            <button
              class="icon-btn"
              id="reportBtn"
              type="button"
              aria-label="Report a problem"
              data-i18n-aria-label="home.toolbar.report"
              data-tip="Report a problem"
              data-tip-i18n="home.toolbar.report"
            ></button>
          </div>
        </div>
        <!-- Windows custom frame only (shown by home.js when OV.isCustomFrame()):
          minimize / maximize-restore / close flush with the window's right
          edge. Direct header children AFTER #tb-mid (not inside it): the
          centred row sizes itself, and anything inside it would drag the
          row off centre or push the buttons out of reach on narrow windows.
          macOS keeps the overlay traffic lights over .tl-group instead. -->
        <span class="tb-sep win-controls-sep" aria-hidden="true" hidden></span>
        <div class="win-controls" id="winControls" role="toolbar" aria-label="Window" hidden>
          <button
            class="win-btn"
            id="winMin"
            type="button"
            tabindex="-1"
            aria-label="Minimize"
            data-i18n-aria-label="window.controls.minimize"
          ></button>
          <button
            class="win-btn"
            id="winMax"
            type="button"
            tabindex="-1"
            aria-label="Maximize"
            data-i18n-aria-label="window.controls.maximize"
          ></button>
          <button
            class="win-btn close"
            id="winClose"
            type="button"
            tabindex="-1"
            aria-label="Close"
            data-i18n-aria-label="window.controls.close"
          ></button>
        </div>
      </header>

      <main class="main" id="main">
        <section class="lo" id="lastOpened" aria-labelledby="loTitle">
          <div class="lo-head">
            <h2 class="sect-label" id="loTitle" data-i18n="home.lastOpened.title">Last Opened</h2>
            <button
              class="btn btn-ghost btn-sm"
              id="showAll"
              type="button"
              data-i18n="home.lastOpened.showAll"
            >
              Show All
            </button>
          </div>
          <div
            class="lo-strip"
            id="loStrip"
            role="list"
            aria-label="Last opened projects"
            data-i18n-aria-label="home.lastOpened.label"
          ></div>
        </section>

        <section class="start" id="startChat" aria-labelledby="startTitle">
          <div class="start-col">
            <h2 id="startTitle" data-i18n="home.start.title">Start a new project</h2>
            <p class="start-hint" data-i18n="home.start.hint">
              Describe the video and drop in footage, music or a script. OpenVids creates the
              project, imports the files, and the agents make the first pass.
            </p>
            <div class="start-chat" id="chatHost"></div>
          </div>
        </section>

        <section class="recent" id="recent" aria-labelledby="recentTitle">
          <div class="content-head">
            <h1 id="recentTitle">
              <span data-i18n="home.recent.title">Recent Projects</span>
              <span class="count num" id="count"></span>
            </h1>
            <div class="head-tools">
              <button
                class="tool-btn"
                id="sortBtn"
                type="button"
                aria-haspopup="menu"
                aria-expanded="false"
                data-tip="Sort projects"
                data-tip-i18n="home.sort.tip"
                data-tip-align="end"
              ></button>
            </div>
          </div>
          <div
            id="body"
            role="listbox"
            aria-label="Recent projects"
            data-i18n-aria-label="home.recent.label"
          ></div>
        </section>
      </main>

      <footer class="statusbar" id="statusbar"></footer>
      <div
        class="ob"
        id="ob"
        role="dialog"
        aria-modal="true"
        aria-label="Set up OpenVids"
        data-i18n-aria-label="home.onboarding.label"
      >
        <div class="ob-scroll-host" id="obMain">
          <div class="ob-loading"><i class="spinner" aria-hidden="true"></i></div>
        </div>
      </div>
      <div id="layer"></div>
    </div>

    <script>
      OV.mountSprite();
    </script>
    <script src="/assets/sheets.js"></script>
    <script src="/assets/composer.js"></script>
    <script src="/assets/home.js"></script>
  </body>
</html>
